name: Auto Unzip
on:
  push:
    paths:
      - '**.zip'

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip and clean up
        run: |
          for f in *.zip; do
            unzip -o "$f"
            rm -f "$f"
          done
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Auto-extracted zip archive"
          git push
          
